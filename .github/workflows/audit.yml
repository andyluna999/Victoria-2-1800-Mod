name: audit

# The build needs a copy of HPM, which this repository does not redistribute, so
# CI checks what it can without one: that every pass is valid Python, that the
# audit suites import, and that nothing has drifted into the invented-syntax
# idioms that have broken this mod three times.
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: every pass compiles
        run: python -m compileall -q tools
      - name: no invented idioms
        run: python tools/ci_idioms.py
